name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les pushes en attente sont regroupés.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.essai.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Site statique : on publie la racine du dépôt telle quelle.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # L'artefact met parfois quelques secondes à être visible de l'API :
      # le 8 octobre 2026, deploy-pages l'a cherché dans la seconde de son
      # envoi et n'a rien trouvé. On réessaie une fois après une pause.
      - id: essai
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.essai.outcome == 'failure'
        run: sleep 20

      - id: deployment
        if: steps.essai.outcome == 'failure'
        uses: actions/deploy-pages@v4
